# TIER 4b - CIFAR-100 version of CIFAR-10's "no outside model" variant (epoch-10 self pairs).
# Reuses the three tier-4 scoring runs (no new scoring).  (~4 h)
config: configs/cifar100_resnet18.yaml
name: cifar100_r18_snap
set: ["score.snapshot_epochs=[10, 30]", "score.checkpoint_epochs=[5, 10, 15, 20, 30, 50, 75]", "score.tracin_early_max=20"]
rescore: true
seeds: [0, 1, 2]
ratios: [0.3, 0.5, 0.7]
methods:
  - {method: pair_influence, emb: self_e10, opts: {influence_key: param_norm_e10}}
