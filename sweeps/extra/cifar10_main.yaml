# Headline comparison (Table 1 / Fig. 1 of the revised paper).
config: configs/cifar10_resnet18.yaml
seeds: [0, 1, 2]
ratios: [0.1, 0.3, 0.5, 0.7]
methods:
  - {method: random}
  - {method: el2n}
  - {method: forgetting}
  - {method: moderate}
  - {method: ccs}
  - {method: pair_random, emb: self}       # SemDeDup-style control: same pairs, random choice
  - {method: pair_influence, emb: self}    # paper's Method 2 (exact-ratio version)
  - {method: pair_influence_rw, emb: self} # + remove-and-reweight
  - {method: pair_merge_rw, emb: self}     # + pairs ordered by merge influence (theory-backed)
