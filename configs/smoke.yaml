# Tiny CPU-only config for checking the pipeline end to end (synthetic data, a few minutes).
name: smoke
data: {dataset: synthetic, val_size: 100, split_seed: 0, normalize: dataset, augment: true, image_size: null}
model: {arch: resnet18_cifar, blocks: [1, 1, 1, 1], width: 8}
train: {epochs: 3, batch_size: 64, optimizer: sgd, lr: 0.05, momentum: 0.9, nesterov: true,
        weight_decay: 5.0e-4, budget: epochs, amp: false, log_every: 1}
score: {el2n_epoch: 1}
influence: {mode: auto, damping: 0.01, exact_max_params: 12000}
embed: {ae: {latent: 32, epochs: 2}}
